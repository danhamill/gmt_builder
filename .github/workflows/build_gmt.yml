name: Build GMT for Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the zip to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-gmt:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GMT into .gmt with micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gmt
          micromamba-root-path: ${{ github.workspace }}\.gmt
          init-shell: powershell
          create-args: >-
            -c conda-forge
            gmt
          post-cleanup: none

      - name: Verify GMT was installed
        run: |
          micromamba run -n gmt gmt --version

      - name: Create ZIP archive from GMT venv only
        run: |
          $venvPath = Join-Path $env:GITHUB_WORKSPACE ".gmt\envs\gmt"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "gmt-windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $venvPath `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmt-windows
          path: gmt-windows.zip
          if-no-files-found: error

      - name: Determine release tag
        id: release
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "tag=${{ inputs.release_tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: gmt-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
